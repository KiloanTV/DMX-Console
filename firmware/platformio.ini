[env]
platform = ststm32
board = genericSTM32F072CB
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
  -D HAL_PCD_MODULE_ENABLED
  -D USBD_VID=0x0483
  -D USBD_PID=0x5740
  -D USB_MANUFACTURER=\"DMX-Console\"
  -D USB_PRODUCT=\"Board-Test\"
build_src_filter = -<*> +<clock.cpp>

[env:dmx_single]
build_src_filter = ${env.build_src_filter} +<dmx1.cpp>

[env:relay]
build_src_filter = ${env.build_src_filter} +<dmx1.cpp>

[env:dmx_4x]
build_src_filter = ${env.build_src_filter} +<dmx4.cpp>

[env:artnet]
build_src_filter = ${env.build_src_filter} +<artnet.cpp>

[env:fader]
build_src_filter = ${env.build_src_filter} +<fader.cpp>
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
